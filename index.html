<!DOCTYPE html>
<html>

<head>
  <title>SafeHer Final Boss</title>

  <style>

    body{
      background:#0b1220;
      color:white;
      font-family:Arial;
      text-align:center;
      padding:20px;
      transition:0.5s;
    }

    .card{
      background:#111827;
      width:400px;
      margin:auto;
      padding:25px;
      border-radius:18px;
      box-shadow:0px 0px 35px #ef4444;
    }

    h1{
      color:#ef4444;
    }

    input{
      padding:12px;
      width:80%;
      border:none;
      border-radius:10px;
      outline:none;
      margin-top:10px;
    }

    button{
      width:85%;
      margin-top:10px;
      padding:12px;
      border:none;
      border-radius:10px;
      cursor:pointer;
      font-size:15px;
      color:white;
      transition:0.3s;
    }

    .login{ background:#3b82f6; }
    .login:hover{ background:#2563eb; }

    .sos{ background:#ef4444; }
    .sos:hover{ background:#b91c1c; }

    .location{ background:#22c55e; }
    .location:hover{ background:#16a34a; }

    .msg{
      margin-top:15px;
      font-size:16px;
      font-weight:bold;
    }

    .panel{
      margin-top:20px;
      background:#0f172a;
      padding:15px;
      border-radius:12px;
      text-align:left;
    }

    .risk{
      margin-top:10px;
      font-size:18px;
    }

    .safe{ color:#22c55e; }
    .danger{ color:#ef4444; }

    @keyframes flash {
      0% { background:#0b1220; }
      50% { background:#7f1d1d; }
      100% { background:#0b1220; }
    }

  </style>

</head>

<body>

  <div class="card">

    <h1>SafeHer Final Boss 🚨</h1>
    <p>AI Powered Women Safety System</p>

    <input type="text" id="name" placeholder="Enter your name">

    <button class="login" onclick="login()">Login</button>
    <button class="sos" onclick="sos()">Panic SOS</button>
    <button class="location" onclick="getLocation()">Live Location</button>

    <div class="msg" id="msg"></div>
    <div class="risk" id="risk"></div>

    <div class="panel">
      <p>📞 Emergency Contacts</p>
      <p>Mom: 9876543210</p>
      <p>Friend: 9123456780</p>
      <p>Police: 112</p>
    </div>

  </div>

<script>

function login(){

  let name = document.getElementById("name").value;

  document.getElementById("msg").innerHTML =
  "👋 Welcome " + name;

  document.getElementById("risk").innerHTML =
  "Status: SAFE 💚";

}

function sos(){

  let msg = document.getElementById("msg");
  let risk = document.getElementById("risk");

  let count = 5;

  msg.innerHTML = "🚨 PANIC MODE ACTIVATED... " + count;

  let timer = setInterval(() => {

    count--;

    msg.innerHTML = "🚨 Sending alert in " + count;

    if(count < 0){

      clearInterval(timer);

      msg.innerHTML = "🚨 ALERT SENT! HELP IS ON THE WAY!";
      risk.innerHTML = "Status: DANGER 🔴";

      // sound
      let audio = new Audio("https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg");
      audio.play().catch(()=>{});

      // flash
      document.body.style.animation = "flash 0.4s 5";
    }

  }, 1000);
}

function getLocation(){

  if(navigator.geolocation){

    navigator.geolocation.getCurrentPosition(function(pos){

      document.getElementById("msg").innerHTML =
      "📍 Location Shared Successfully";

      document.getElementById("risk").innerHTML =
      "Lat: " + pos.coords.latitude + " | Long: " + pos.coords.longitude;

    });

  } else {
    alert("Location not supported");
  }

}

</script>

</body>

</html>
