<!DOCTYPE html>
<html>

<head>
  <title>Hackathon Dashboard</title>

  <style>

    body{
      background:#0f172a;
      color:white;
      font-family:Arial;
      text-align:center;
      padding-top:100px;
    }

    .card{
      background:#1e293b;
      width:300px;
      margin:auto;
      padding:30px;
      border-radius:20px;
      box-shadow:0px 0px 20px #3b82f6;
    }

    input{
      padding:12px;
      width:80%;
      border:none;
      border-radius:10px;
      outline:none;
    }

    button{
      background:#3b82f6;
      color:white;
      border:none;
      padding:12px 20px;
      border-radius:10px;
      cursor:pointer;
    }

    button:hover{
      background:#2563eb;
    }

    canvas{
      margin-top:40px;
    }

  </style>

</head>

<body>

  <div class="card">

    <h1>AtomQuest Hackathon</h1>

    <p>My first deployed project 🚀</p>

    <input type="text" id="username" placeholder="Enter your name">

    <br><br>

    <button onclick="showMessage()">
      Login
    </button>

    <h3 id="message"></h3>

  </div>

  <canvas id="myChart" width="200" height="200"></canvas>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

function showMessage(){

  let name = document.getElementById("username").value;

  document.getElementById("message").innerHTML =
  "Welcome " + name + " 🚀";

}

const ctx = document.getElementById('myChart');

new Chart(ctx, {
  type: 'bar',
  data: {
    labels: ['Mon', 'Tue', 'Wed', 'Thu'],
    datasets: [{
      label: 'Users',
      data: [12, 19, 8, 15]
    }]
  }
});

</script>

</body>

</html>
