<!DOCTYPE html>
<html>

<head>
  <title>SafeHer - Women Safety Dashboard</title>

  <style>

    body{
      background:#0f172a;
      color:white;
      font-family:Arial;
      text-align:center;
      padding-top:30px;
    }

    .card{
      background:#1e293b;
      width:340px;
      margin:auto;
      padding:30px;
      border-radius:20px;
      box-shadow:0px 0px 25px red;
    }

    input{
      padding:12px;
      width:80%;
      border:none;
      border-radius:10px;
      outline:none;
      margin-top:10px;
    }

    button{
      background:red;
      color:white;
      border:none;
      padding:14px 22px;
      border-radius:10px;
      cursor:pointer;
      font-size:15px;
      margin-top:15px;
    }

    button:hover{
      background:#cc0000;
    }

    .msg{
      margin-top:15px;
      font-size:18px;
      color:#22c55e;
    }

    .safeBox{
      margin-top:25px;
      background:#111827;
      padding:15px;
      border-radius:10px;
    }

    .safeBox p{
      margin:5px;
    }

  </style>

</head>

<body>

  <div class="card">

    <h1>SafeHer 🚨</h1>
    <p>Women Safety Dashboard</p>

    <input type="text" id="name" placeholder="Enter your name">

    <br>

    <button onclick="login()">Login</button>

    <button onclick="sos()">SOS ALERT</button>

    <div class="msg" id="msg"></div>

    <div class="safeBox">
      <p>📞 Mom: 9876543210</p>
      <p>📞 Friend: 9123456780</p>
      <p>📞 Police: 112</p>
    </div>

  </div>

<script>

function login(){

  let name = document.getElementById("name").value;

  document.getElementById("msg").innerHTML =
  "Welcome " + name + " 💖 Stay Safe!";

}

function sos(){

  document.getElementById("msg").innerHTML =
  "🚨 Emergency Alert Sent! Help is on the way 💖";

}

</script>

</body>

</html>
