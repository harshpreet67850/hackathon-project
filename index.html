<!DOCTYPE html>
<html>

<head>
  <title>SafeHer Pro - Women Safety System</title>

  <style>

    body{
      background:#0b1220;
      color:white;
      font-family:Arial;
      text-align:center;
      padding:20px;
    }

    .card{
      background:#111827;
      width:380px;
      margin:auto;
      padding:25px;
      border-radius:18px;
      box-shadow:0px 0px 30px #ef4444;
    }

    h1{
      color:#ef4444;
    }

    input{
      padding:12px;
      width:80%;
      border:none;
      border-radius:10px;
      outline:none;
      margin-top:10px;
    }

    button{
      width:85%;
      margin-top:10px;
      padding:12px;
      border:none;
      border-radius:10px;
      cursor:pointer;
      font-size:15px;
      color:white;
    }

    .login{
      background:#3b82f6;
    }

    .sos{
      background:#ef4444;
    }

    .location{
      background:#22c55e;
    }

    .msg{
      margin-top:15px;
      font-size:16px;
    }

    .panel{
      margin-top:20px;
      background:#0f172a;
      padding:15px;
      border-radius:12px;
      text-align:left;
    }

    .safe{
      color:#22c55e;
    }

    .danger{
      color:#ef4444;
    }

  </style>

</head>

<body>

  <div class="card">

    <h1>SafeHer Pro 🚨</h1>
    <p>AI Powered Women Safety System</p>

    <input type="text" id="name" placeholder="Enter your name">

    <button class="login" onclick="login()">Login</button>
    <button class="sos" onclick="sos()">Emergency SOS</button>
    <button class="location" onclick="getLocation()">Live Location</button>

    <div class="msg" id="msg"></div>

    <div class="panel">
      <p>📞 Emergency Contacts</p>
      <p>Mom: 9876543210</p>
      <p>Friend: 9123456780</p>
      <p>Police: 112</p>
    </div>

  </div>

<script>

function login(){

  let name = document.getElementById("name").value;

  document.getElementById("msg").innerHTML =
  "👋 Welcome " + name + " | Status: SAFE 💚";

}

function sos(){

  document.getElementById("msg").innerHTML =
  "🚨 ALERT SENT! Emergency services notified!";

  // sound alert
  let audio = new Audio("https://www.soundjay.com/buttons/sounds/beep-07.mp3");
  audio.play();

  // visual danger highlight
  document.body.style.background = "#2a0a0a";

}

function getLocation(){

  if(navigator.geolocation){

    navigator.geolocation.getCurrentPosition(function(pos){

      document.getElementById("msg").innerHTML =
      "📍 Live Location: " + pos.coords.latitude + ", " + pos.coords.longitude;

    });

  } else {
    alert("Location not supported");
  }

}

</script>

</body>

</html>
