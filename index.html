<!DOCTYPE html>
<html>
<head>
<title>SafeHer Shield FINAL</title>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<style>

body{
  background:#0b1220;
  color:white;
  font-family:Arial;
  text-align:center;
  padding:20px;
  transition:0.3s;
}

.card{
  background:#111827;
  width:420px;
  margin:auto;
  padding:25px;
  border-radius:18px;
  box-shadow:0 0 35px #ef4444;
}

h1{ color:#ef4444; }

input{
  padding:12px;
  width:80%;
  border:none;
  border-radius:10px;
  margin-top:10px;
}

button{
  width:85%;
  margin-top:10px;
  padding:12px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  color:white;
  font-weight:bold;
}

.login{ background:#3b82f6; }
.sos{ background:#ef4444; }
.loc{ background:#22c55e; }
.voice{ background:#a855f7; }
.stealth{ background:#f59e0b; }

/* 🚨 FULL SCREEN ALERT */
.alert-screen{
  position:fixed;
  top:0; left:0;
  width:100%;
  height:100%;
  background:rgba(120,0,0,0.95);
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:9999;
  text-align:center;
}

.alert-box{
  font-size:22px;
  font-weight:bold;
}

/* SUCCESS */
.success{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#22c55e;
  padding:10px 15px;
  border-radius:10px;
  font-weight:bold;
}

/* ERROR */
.error{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#ef4444;
  padding:10px 15px;
  border-radius:10px;
  font-weight:bold;
}

/* FLASH */
.flash{
  animation:flash 0.2s infinite;
}

@keyframes flash{
  0%{background:#0b1220;}
  50%{background:#2a0000;}
  100%{background:#0b1220;}
}

</style>
</head>

<body>

<div class="card">

<h1>🚨 SafeHer Shield FINAL</h1>

<input id="name" placeholder="Enter Name">
<input id="phone" placeholder="Email / Contact">

<button class="login" onclick="login()">Login</button>
<button class="sos" onclick="sos()">🚨 PANIC SOS</button>
<button class="loc" onclick="startTracking()">📍 LIVE LOCATION</button>
<button class="voice" onclick="voiceSOS()">🎙️ VOICE SOS</button>
<button class="stealth" onclick="stealthMode()">🕵️ STEALTH MODE</button>

<input id="manualSOS" placeholder="Type SOS here">
<button onclick="textSOS()">TYPE SOS</button>

</div>

<!-- ALERT UI -->
<div class="alert-screen" id="alertBox">
  <div class="alert-box" id="alertText">🚨 EMERGENCY DETECTED</div>
</div>

<script>

emailjs.init("YOUR_PUBLIC_KEY");

let lat=0,long=0,stealth=false;

/* 🔊 HIGH IMPACT SIREN (single burst + strong volume) */
let siren = new Audio("https://actions.google.com/sounds/v1/emergency/emergency_siren_short.ogg");
siren.volume = 1.0;

/* 📳 VIBRATION */
function vibrate(){
  if(navigator.vibrate){
    navigator.vibrate([600,300,600,300,900]);
  }
}

/* 🚨 SHOW ALERT SCREEN */
function showAlert(text){
  let box=document.getElementById("alertBox");
  let msg=document.getElementById("alertText");

  msg.innerHTML=text;
  box.style.display="flex";
}

/* ❌ HIDE ALERT */
function hideAlert(){
  document.getElementById("alertBox").style.display="none";
}

/* 📧 SEND SOS */
function sendSOS(){

  let name=document.getElementById("name").value;
  let contact=document.getElementById("phone").value;

  return emailjs.send("SERVICE_ID","TEMPLATE_ID",{
    name:name,
    contact:contact,
    location:`https://maps.google.com/?q=${lat},${long}`,
    time:new Date().toLocaleString()
  });
}

/* 🧠 STATUS */
function getRiskScore(){
  let score=0;
  let hour=new Date().getHours();

  if(hour>=22||hour<=5) score+=50;
  if(lat!==0 && long!==0) score+=20;
  if(stealth) score+=10;

  if(score>=70) return "🔴 EXTREME DANGER";
  if(score>=40) return "🟠 MEDIUM RISK";
  return "🟢 SAFE";
}

/* 🚨 MAIN SOS */
function sos(){

  document.body.classList.add("flash");

  siren.currentTime = 0;
  siren.play().catch(()=>{});

  vibrate();
  showAlert("🚨 SOS ACTIVATED<br>"+getRiskScore());

  setTimeout(()=>{

    sendSOS()
    .then(()=>{
      showSuccess("SOS SENT SUCCESSFULLY");
    })
    .catch(()=>{
      showError("SOS FAILED ❌ CHECK EMAILJS");
    });

  },1200);
}

/* 📍 LOCATION */
function startTracking(){

  navigator.geolocation.watchPosition(
    (pos)=>{
      lat=pos.coords.latitude;
      long=pos.coords.longitude;
    },
    ()=>showError("LOCATION BLOCKED ❌"),
    {enableHighAccuracy:true}
  );
}

/* 🎙️ VOICE */
function voiceSOS(){

  let SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  let rec=new SR();
  rec.lang="en-US";

  rec.onresult=(e)=>{
    let text=e.results[0][0].transcript.toLowerCase();
    if(text.includes("help")||text.includes("sos")){
      sos();
    }
  };

  rec.start();
}

/* TEXT */
function textSOS(){
  let v=document.getElementById("manualSOS").value.toLowerCase();
  if(v.includes("sos")||v.includes("help")||v.includes("emergency")){
    sos();
  }
}

/* STEALTH */
function stealthMode(){
  stealth=!stealth;
  document.querySelector(".card").style.display = stealth ? "none" : "block";
}

/* SUCCESS */
function showSuccess(msg){
  let d=document.createElement("div");
  d.className="success";
  d.innerText=msg;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),4000);
}

/* ERROR */
function showError(msg){
  let d=document.createElement("div");
  d.className="error";
  d.innerText=msg;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),4000);
}

</script>

</body>
</html>
