<!DOCTYPE html>
<html>
<head>
  <title>SafeHer Shield AI</title>

  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

  <style>
    body{
      background:#0b1220;
      color:white;
      font-family:Arial;
      text-align:center;
      padding:20px;
    }

    .card{
      background:#111827;
      width:420px;
      margin:auto;
      padding:25px;
      border-radius:18px;
      box-shadow:0 0 35px #ef4444;
    }

    h1{ color:#ef4444; }

    input{
      padding:12px;
      width:80%;
      border:none;
      border-radius:10px;
      margin-top:10px;
    }

    button{
      width:85%;
      margin-top:10px;
      padding:12px;
      border:none;
      border-radius:10px;
      cursor:pointer;
      color:white;
    }

    .login{ background:#3b82f6; }
    .sos{ background:#ef4444; }
    .loc{ background:#22c55e; }
    .voice{ background:#a855f7; }
    .stealth{ background:#f59e0b; }

    .panel{
      margin-top:15px;
      background:#0f172a;
      padding:12px;
      border-radius:10px;
      text-align:left;
      font-size:13px;
    }

    .status{
      margin-top:15px;
      font-weight:bold;
      font-size:14px;
    }

  </style>
</head>

<body>

<div class="card">

  <h1>🚨 SafeHer Shield AI</h1>

  <input id="name" placeholder="Enter Name">
  <input id="phone" placeholder="Enter Contact (for SOS email)">

  <button class="login" onclick="login()">Login</button>
  <button class="sos" onclick="sos()">PANIC SOS</button>
  <button class="loc" onclick="startTracking()">LIVE LOCATION</button>
  <button class="voice" onclick="voiceSOS()">VOICE SOS</button>
  <button class="stealth" onclick="stealthMode()">STEALTH MODE</button>

  <div id="status" class="status"></div>

  <div class="panel">
    <p>📞 Emergency Contacts (Editable later via Firebase)</p>
    <p id="contacts">Mom: 9876543210 | Friend: 9123456780 | Police: 112</p>
  </div>

</div>

<script>
emailjs.init("YOUR_PUBLIC_KEY");

let lat = 0;
let long = 0;

/* ---------------- AI RISK ENGINE ---------------- */
function getRisk(){

  let hour = new Date().getHours();

  if(hour >= 22 || hour <= 5){
    return "🔴 HIGH RISK (Night Time)";
  }

  return "🟢 SAFE";
}

/* ---------------- LOGIN ---------------- */
function login(){

  let name = document.getElementById("name").value;

  document.getElementById("status").innerHTML =
  "👋 Welcome " + name + " | Status: " + getRisk();
}

/* ---------------- EMAIL SOS ---------------- */
function sendEmail(name){

  emailjs.send("SERVICE_ID","TEMPLATE_ID",{
    name: name,
    location: `https://maps.google.com/?q=${lat},${long}`,
    time: new Date().toLocaleString()
  }).catch(err=>console.log(err));

}

/* ---------------- FIXED SOS ---------------- */
function sos(){

  let name = document.getElementById("name").value;

  document.getElementById("status").innerHTML =
  "🚨 SOS ACTIVATED... Sending alerts...";

  setTimeout(()=>{

    document.getElementById("status").innerHTML =
    "🚨 ALERT SENT! Status: " + getRisk();

    sendEmail(name);

    let audio = new Audio("https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg");
    audio.play().catch(()=>{});

    document.body.style.background = "#7f1d1d";

  },2000);
}

/* ---------------- FIXED LOCATION (watchPosition) ---------------- */
function startTracking(){

  if(navigator.geolocation){

    navigator.geolocation.watchPosition((pos)=>{

      lat = pos.coords.latitude;
      long = pos.coords.longitude;

      document.getElementById("status").innerHTML =
      `📍 Live Location: ${lat}, ${long}
      <br>Map: https://maps.google.com/?q=${lat},${long}
      <br>Status: ${getRisk()}`;

    });

  } else {
    alert("Location not supported");
  }
}

/* ---------------- FIXED VOICE SOS ---------------- */
function voiceSOS(){

  let recognition = new webkitSpeechRecognition();
  recognition.continuous = false;

  recognition.onresult = function(event){

    let text = event.results[0][0].transcript.toLowerCase();

    if(text.includes("help") || text.includes("emergency")){
      sos();
    }

  };

  recognition.start();
}

/* ---------------- SHAKE SOS ---------------- */
window.addEventListener("devicemotion", function(e){

  if(e.acceleration.x > 15 || e.acceleration.y > 15){
    sos();
  }

});

/* ---------------- STEALTH MODE ---------------- */
function stealthMode(){

  document.getElementById("name").value = "";
  document.getElementById("status").innerHTML = "";

  document.querySelector(".card").style.display = "none";

  alert("Stealth Mode Activated (Background SOS Active)");
}

</script>

</body>
</html>
