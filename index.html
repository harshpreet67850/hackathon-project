<!DOCTYPE html>
<html>

<head>
  <title>SafeHer - Women Safety Dashboard</title>

  <style>

    body{
      background:#0f172a;
      color:white;
      font-family:Arial;
      text-align:center;
      padding-top:50px;
    }

    .card{
      background:#1e293b;
      width:320px;
      margin:auto;
      padding:30px;
      border-radius:20px;
      box-shadow:0px 0px 20px red;
    }

    button{
      background:red;
      color:white;
      border:none;
      padding:15px 25px;
      border-radius:10px;
      cursor:pointer;
      font-size:16px;
      margin-top:15px;
    }

    button:hover{
      background:#cc0000;
    }

    .safe{
      margin-top:20px;
      font-size:18px;
    }

    .contacts{
      margin-top:30px;
      background:#111827;
      padding:15px;
      border-radius:10px;
    }

  </style>

</head>

<body>

  <div class="card">

    <h1>SafeHer 🚨</h1>
    <p>Women Safety Dashboard</p>

    <button onclick="sendSOS()">SOS ALERT</button>

    <div class="safe" id="status"></div>

    <div class="contacts">
      <p>📞 Mom: 9876543210</p>
      <p>📞 Friend: 9123456780</p>
      <p>📞 Police: 112</p>
    </div>

  </div>

<script>

function sendSOS(){

  document.getElementById("status").innerHTML =
  "🚨 Emergency Alert Sent! Help is on the way 💖";

}

</script>

</body>

</html>
