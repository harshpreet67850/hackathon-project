<!DOCTYPE html>
<html>
<head>
<title>SafeHer Shield AI ULTRA</title>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<style>

body{
  background:#0b1220;
  color:white;
  font-family:Arial;
  text-align:center;
  padding:20px;
  transition:0.3s;
}

.card{
  background:#111827;
  width:420px;
  margin:auto;
  padding:25px;
  border-radius:18px;
  box-shadow:0 0 35px #ef4444;
}

h1{ color:#ef4444; }

input{
  padding:12px;
  width:80%;
  border:none;
  border-radius:10px;
  margin-top:10px;
}

button{
  width:85%;
  margin-top:10px;
  padding:12px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  color:white;
  font-weight:bold;
}

.login{ background:#3b82f6; }
.sos{ background:#ef4444; }
.loc{ background:#22c55e; }
.voice{ background:#a855f7; }
.stealth{ background:#f59e0b; }

/* ⚡ ALERT FLASH */
.alert-bg{
  background:#3b0000 !important;
  animation:flash 0.3s infinite;
}

@keyframes flash{
  0%{background:#3b0000;}
  50%{background:#0b1220;}
  100%{background:#3b0000;}
}

/* 📢 TOAST */
.toast{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  background:#ef4444;
  padding:12px 20px;
  border-radius:10px;
  font-weight:bold;
  display:none;
  z-index:999;
}

/* ✅ SUCCESS */
.success{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#22c55e;
  padding:10px 15px;
  border-radius:10px;
  font-weight:bold;
}

/* 📍 STATUS */
.status{
  margin-top:15px;
  font-weight:bold;
}

</style>
</head>

<body>

<div class="toast" id="toast">🚨 DANGER DETECTED</div>

<div class="card">

<h1>🚨 SafeHer Shield ULTRA</h1>

<input id="name" placeholder="Enter Name">
<input id="phone" placeholder="Email / Contact">

<button class="login" onclick="login()">Login</button>
<button class="sos" onclick="sos()">🚨 PANIC SOS</button>
<button class="loc" onclick="startTracking()">📍 LIVE LOCATION</button>
<button class="voice" onclick="voiceSOS()">🎙️ VOICE SOS</button>
<button class="stealth" onclick="stealthMode()">🕵️ STEALTH MODE</button>

<input id="manualSOS" placeholder="Type SOS here">
<button onclick="textSOS()">TYPE SOS</button>

<div id="status" class="status"></div>

</div>

<script>

emailjs.init("YOUR_PUBLIC_KEY");

let lat=0,long=0,stealth=false;

/* 🔊 LOUD SIREN (loop) */
let alarm;

function playAlarm(){

  if(alarm) return;

  alarm = new Audio("https://actions.google.com/sounds/v1/emergency/beeper_emergency_call.ogg");
  alarm.loop = true;
  alarm.volume = 1.0;
  alarm.play();
}

/* STOP SOUND */
function stopAlarm(){
  if(alarm){
    alarm.pause();
    alarm = null;
  }
}

/* 📳 VIBRATION */
function vibrate(){
  if(navigator.vibrate){
    navigator.vibrate([500,300,500,300,800]);
  }
}

/* 📢 TOAST */
function showToast(msg){
  let t=document.getElementById("toast");
  t.innerText=msg;
  t.style.display="block";

  setTimeout(()=>t.style.display="none",3000);
}

/* 🧠 STATUS */
function getRiskScore(){
  let score=0;
  let hour=new Date().getHours();

  if(hour>=22||hour<=5) score+=50;
  if(lat!==0 && long!==0) score+=20;
  if(stealth) score+=10;

  if(score>=70) return "🔴 EXTREME DANGER ("+score+")";
  if(score>=40) return "🟠 MEDIUM DANGER ("+score+")";
  return "🟢 SAFE ("+score+")";
}

/* LOGIN */
function login(){
  let name=document.getElementById("name").value;
  document.getElementById("status").innerHTML=
  "👋 Welcome "+name+" | "+getRiskScore();
}

/* 📧 SEND SOS */
function sendSOS(){

  let name=document.getElementById("name").value;
  let contact=document.getElementById("phone").value;

  emailjs.send("SERVICE_ID","TEMPLATE_ID",{
    name:name,
    contact:contact,
    location:`https://maps.google.com/?q=${lat},${long}`,
    time:new Date().toLocaleString()
  }).then(()=>{

    showSuccess("✅ SOS SENT SUCCESSFULLY");

  }).catch(()=>{
    showSuccess("❌ FAILED TO SEND SOS");
  });
}

/* SUCCESS BADGE */
function showSuccess(msg){
  let s=document.createElement("div");
  s.className="success";
  s.innerText=msg;
  document.body.appendChild(s);

  setTimeout(()=>s.remove(),4000);
}

/* 🚨 SOS */
function sos(){

  document.body.classList.add("alert-bg");

  playAlarm();
  vibrate();
  showToast("🚨 EMERGENCY DETECTED");

  document.getElementById("status").innerHTML=
  "🚨 SOS ACTIVE... "+getRiskScore();

  setTimeout(()=>{
    sendSOS();
  },1500);
}

/* 📍 LOCATION */
function startTracking(){

  navigator.geolocation.watchPosition(
    (pos)=>{
      lat=pos.coords.latitude;
      long=pos.coords.longitude;

      document.getElementById("status").innerHTML=
      `📍 ${lat},${long}<br>${getRiskScore()}`;
    },
    ()=>alert("Location blocked"),
    {enableHighAccuracy:true}
  );
}

/* 🎙️ VOICE */
function voiceSOS(){

  let SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  let rec=new SR();
  rec.lang="en-US";

  rec.onresult=(e)=>{
    let text=e.results[0][0].transcript.toLowerCase();
    if(text.includes("help")||text.includes("sos")){
      sos();
    }
  };

  rec.start();
}

/* TEXT */
function textSOS(){
  let v=document.getElementById("manualSOS").value.toLowerCase();
  if(v.includes("sos")||v.includes("help")||v.includes("emergency")){
    sos();
  }
}

/* STEALTH */
function stealthMode(){
  stealth=!stealth;

  if(stealth){
    document.querySelector(".card").style.display="none";

    let fake=document.createElement("div");
    fake.innerHTML="📱 System Running Secure Mode...";
    fake.id="fakeScreen";
    document.body.appendChild(fake);
  }else{
    document.querySelector(".card").style.display="block";
    document.getElementById("fakeScreen")?.remove();
  }
}

</script>

</body>
</html>
