<!DOCTYPE html>
<html>

<head>
  <title>SafeHer - Women Safety Dashboard</title>

  <style>

    body{
      background:#0f172a;
      color:white;
      font-family:Arial;
      text-align:center;
      padding-top:30px;
    }

    .card{
      background:#1e293b;
      width:350px;
      margin:auto;
      padding:30px;
      border-radius:20px;
      box-shadow:0px 0px 25px red;
    }

    input{
      padding:12px;
      width:80%;
      border:none;
      border-radius:10px;
      outline:none;
      margin-top:10px;
    }

    button{
      background:red;
      color:white;
      border:none;
      padding:14px 22px;
      border-radius:10px;
      cursor:pointer;
      font-size:15px;
      margin-top:12px;
    }

    button:hover{
      background:#cc0000;
    }

    .msg{
      margin-top:15px;
      font-size:18px;
    }

    .safe{
      color:#22c55e;
    }

    .danger{
      color:#ef4444;
    }

    .box{
      margin-top:20px;
      background:#111827;
      padding:15px;
      border-radius:10px;
    }

  </style>

</head>

<body>

  <div class="card">

    <h1>SafeHer 🚨</h1>
    <p>Women Safety Dashboard</p>

    <input type="text" id="name" placeholder="Enter your name">

    <br>

    <button onclick="login()">Login</button>
    <button onclick="sos()">SOS ALERT</button>
    <button onclick="locationTrack()">📍 My Location</button>

    <div id="msg" class="msg"></div>

    <div class="box">
      <p>📞 Mom: 9876543210</p>
      <p>📞 Friend: 9123456780</p>
      <p>📞 Police: 112</p>
    </div>

  </div>

<script>

function login(){

  let name = document.getElementById("name").value;

  document.getElementById("msg").innerHTML =
  "Welcome " + name + " 💖 Stay Safe";

}

function sos(){

  document.getElementById("msg").innerHTML =
  "🚨 EMERGENCY ALERT SENT! HELP IS ON THE WAY!";

  // siren sound
  let audio = new Audio("https://www.soundjay.com/buttons/sounds/beep-07.mp3");
  audio.play();

}

function locationTrack(){

  if(navigator.geolocation){

    navigator.geolocation.getCurrentPosition(function(position){

      document.getElementById("msg").innerHTML =
      "📍 Location: " + position.coords.latitude + ", " + position.coords.longitude;

    });

  } else {
    alert("Location not supported");
  }

}

</script>

</body>

</html>
