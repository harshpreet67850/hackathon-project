<!DOCTYPE html>
<html>
<head>
  <title>SafeHer Shield AI</title>

  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

  <style>
    body{
      background:#0b1220;
      color:white;
      font-family:Arial;
      text-align:center;
      padding:20px;
    }

    .card{
      background:#111827;
      width:420px;
      margin:auto;
      padding:25px;
      border-radius:18px;
      box-shadow:0 0 35px #ef4444;
      transition:0.3s;
    }

    h1{ color:#ef4444; }

    input{
      padding:12px;
      width:80%;
      border:none;
      border-radius:10px;
      margin-top:10px;
      outline:none;
    }

    button{
      width:85%;
      margin-top:10px;
      padding:12px;
      border:none;
      border-radius:10px;
      cursor:pointer;
      color:white;
      font-size:14px;
    }

    .login{ background:#3b82f6; }
    .sos{ background:#ef4444; }
    .loc{ background:#22c55e; }
    .voice{ background:#a855f7; }
    .stealth{ background:#f59e0b; }

    .panel{
      margin-top:15px;
      background:#0f172a;
      padding:12px;
      border-radius:10px;
      text-align:left;
      font-size:13px;
    }

    .status{
      margin-top:15px;
      font-weight:bold;
      font-size:14px;
    }

    #fakeScreen{
      margin-top:120px;
      font-size:18px;
      color:#22c55e;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>🚨 SafeHer Shield AI</h1>

  <input id="name" placeholder="Enter Name">
  <input id="phone" placeholder="Enter Email / Contact for SOS">

  <button class="login" onclick="login()">Login</button>
  <button class="sos" onclick="sos()">PANIC SOS</button>
  <button class="loc" onclick="startTracking()">LIVE LOCATION</button>
  <button class="voice" onclick="voiceSOS()">VOICE SOS</button>
  <button class="stealth" onclick="stealthMode()">STEALTH MODE</button>

  <div id="status" class="status"></div>

  <div class="panel">
    <p>📞 Emergency Contacts</p>
    <p>Mom: 9876543210 | Friend: 9123456780 | Police: 112</p>
  </div>

</div>

<script>

emailjs.init("YOUR_PUBLIC_KEY");

let lat = 0;
let long = 0;
let stealthActive = false;

/* ---------------- RISK ENGINE ---------------- */
function getRisk(){
  let hour = new Date().getHours();
  if(hour >= 22 || hour <= 5){
    return "🔴 HIGH RISK (Night Time)";
  }
  return "🟢 SAFE";
}

/* ---------------- LOGIN ---------------- */
function login(){
  let name = document.getElementById("name").value;

  document.getElementById("status").innerHTML =
  "👋 Welcome " + name + " | Status: " + getRisk();
}

/* ---------------- EMAIL SOS ---------------- */
function sendEmail(name){

  let contact = document.getElementById("phone").value;

  emailjs.send("SERVICE_ID","TEMPLATE_ID",{
    name: name,
    contact: contact,
    location: `https://maps.google.com/?q=${lat},${long}`,
    time: new Date().toLocaleString()
  }).catch(err=>console.log("Email error:", err));
}

/* ---------------- SOS ---------------- */
function sos(){

  let name = document.getElementById("name").value;

  document.getElementById("status").innerHTML =
  "🚨 SOS ACTIVATED... Sending alerts...";

  setTimeout(()=>{

    document.getElementById("status").innerHTML =
    "🚨 ALERT SENT! Status: " + getRisk();

    sendEmail(name);

    let audio = new Audio("https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg");
    audio.play().catch(()=>{});

    document.body.style.background = "#7f1d1d";

  },1500);
}

/* ---------------- LIVE LOCATION FIXED ---------------- */
function startTracking(){

  if(!navigator.geolocation){
    alert("Geolocation not supported");
    return;
  }

  navigator.geolocation.watchPosition(
    (pos)=>{
      lat = pos.coords.latitude;
      long = pos.coords.longitude;

      document.getElementById("status").innerHTML =
      `📍 Live Location: ${lat}, ${long}
      <br>Map: https://maps.google.com/?q=${lat},${long}
      <br>Status: ${getRisk()}`;
    },
    (err)=>{
      console.log(err);
      alert("❌ Location permission denied or unavailable");
    },
    { enableHighAccuracy: true }
  );
}

/* ---------------- VOICE SOS FIXED ---------------- */
function voiceSOS(){

  let SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if(!SpeechRecognition){
    alert("Voice not supported in this browser");
    return;
  }

  let recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.lang = "en-US";

  recognition.onresult = function(event){

    let text = event.results[0][0].transcript.toLowerCase();

    document.getElementById("status").innerHTML =
    "🎙️ Heard: " + text;

    if(text.includes("help") || text.includes("emergency") || text.includes("sos")){
      sos();
    }
  };

  recognition.start();
}

/* ---------------- SHAKE SOS ---------------- */
window.addEventListener("devicemotion", function(e){

  if(e.acceleration.x > 15 || e.acceleration.y > 15){
    sos();
  }

});

/* ---------------- STEALTH MODE FIXED ---------------- */
function stealthMode(){

  stealthActive = !stealthActive;

  if(stealthActive){

    document.querySelector(".card").style.display = "none";

    if(!document.getElementById("fakeScreen")){
      let fake = document.createElement("div");
      fake.id = "fakeScreen";
      fake.innerHTML = "📱 System Running...";
      document.body.appendChild(fake);
    }

    document.getElementById("status").innerHTML =
    "🕵️ Stealth Mode ON (SOS ACTIVE IN BACKGROUND)";
  }
  else{

    document.querySelector(".card").style.display = "block";
    document.getElementById("fakeScreen")?.remove();

    document.getElementById("status").innerHTML =
    "👁️ Stealth Mode OFF";
  }
}

</script>

</body>
</html>
