<!DOCTYPE html>
<html>
<head>
  <title>SafeHer Shield AI PRO</title>

  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

  <style>
    body{
      background:#0b1220;
      color:white;
      font-family:Arial;
      text-align:center;
      padding:20px;
    }

    .card{
      background:#111827;
      width:420px;
      margin:auto;
      padding:25px;
      border-radius:18px;
      box-shadow:0 0 35px #ef4444;
    }

    h1{ color:#ef4444; }

    input{
      padding:12px;
      width:80%;
      border:none;
      border-radius:10px;
      margin-top:10px;
    }

    button{
      width:85%;
      margin-top:10px;
      padding:12px;
      border:none;
      border-radius:10px;
      cursor:pointer;
      color:white;
    }

    .login{ background:#3b82f6; }
    .sos{ background:#ef4444; }
    .loc{ background:#22c55e; }
    .voice{ background:#a855f7; }
    .stealth{ background:#f59e0b; }

    .status{
      margin-top:15px;
      font-weight:bold;
    }

    #fakeScreen{
      margin-top:120px;
      font-size:18px;
      color:#22c55e;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>🚨 SafeHer Shield AI PRO</h1>

  <input id="name" placeholder="Enter Name">
  <input id="phone" placeholder="Email / Contact">

  <button class="login" onclick="login()">Login</button>
  <button class="sos" onclick="sos()">🚨 PANIC SOS</button>
  <button class="loc" onclick="startTracking()">📍 LIVE LOCATION</button>
  <button class="voice" onclick="voiceSOS()">🎙️ VOICE SOS</button>
  <button class="stealth" onclick="stealthMode()">🕵️ STEALTH MODE</button>

  <input id="manualSOS" placeholder="Type SOS here (backup)">
  <button onclick="textSOS()">TYPE SOS</button>

  <div id="status" class="status"></div>

</div>

<script>

emailjs.init("YOUR_PUBLIC_KEY");

let lat=0,long=0,stealth=false;

/* ---------------- LOGIN ---------------- */
function login(){
  let name=document.getElementById("name").value;
  document.getElementById("status").innerHTML=
  "👋 Welcome "+name+" | Risk: "+getRisk();
}

/* ---------------- AI RISK ---------------- */
function getRisk(){
  let h=new Date().getHours();
  return (h>=22||h<=5)?"🔴 HIGH RISK":"🟢 SAFE";
}

/* ---------------- SOS CORE ---------------- */
function sendSOS(){

  let name=document.getElementById("name").value;
  let contact=document.getElementById("phone").value;

  emailjs.send("SERVICE_ID","TEMPLATE_ID",{
    name:name,
    contact:contact,
    location:`https://maps.google.com/?q=${lat},${long}`,
    time:new Date().toLocaleString()
  });

  let audio=new Audio("https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg");
  audio.play().catch(()=>{});
}

/* ---------------- BUTTON SOS ---------------- */
function sos(){
  document.getElementById("status").innerHTML="🚨 SOS ACTIVATED...";
  setTimeout(()=>{
    sendSOS();
    document.getElementById("status").innerHTML="🚨 ALERT SENT!";
  },1200);
}

/* ---------------- LIVE LOCATION ---------------- */
function startTracking(){

  if(!navigator.geolocation){
    alert("Not supported");
    return;
  }

  navigator.geolocation.watchPosition(
    (pos)=>{
      lat=pos.coords.latitude;
      long=pos.coords.longitude;

      document.getElementById("status").innerHTML=
      `📍 ${lat},${long}<br>${getRisk()}`;
    },
    ()=>alert("Location blocked"),
    {enableHighAccuracy:true}
  );
}

/* ---------------- VOICE SOS FIX ---------------- */
function voiceSOS(){

  let SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  if(!SR){
    alert("Use Chrome Desktop for voice");
    return;
  }

  let rec=new SR();
  rec.lang="en-US";

  rec.onresult=(e)=>{
    let text=e.results[0][0].transcript.toLowerCase();
    document.getElementById("status").innerHTML="🎙️ "+text;
    if(text.includes("help")||text.includes("sos")||text.includes("emergency")){
      sos();
    }
  };

  rec.start();
}

/* ---------------- TEXT SOS (FALLBACK) ---------------- */
function textSOS(){
  let val=document.getElementById("manualSOS").value.toLowerCase();
  if(val.includes("sos")||val.includes("help")){
    sos();
  }
}

/* ---------------- SHAKE SOS ---------------- */
window.addEventListener("devicemotion",(e)=>{
  if(e.acceleration.x>15||e.acceleration.y>15){
    sos();
  }
});

/* ---------------- STEALTH MODE ---------------- */
function stealthMode(){

  stealth=!stealth;

  if(stealth){
    document.querySelector(".card").style.display="none";

    let fake=document.createElement("div");
    fake.id="fakeScreen";
    fake.innerHTML="📱 System Running...";
    document.body.appendChild(fake);
  }
  else{
    document.querySelector(".card").style.display="block";
    document.getElementById("fakeScreen")?.remove();
  }
}

</script>

</body>
</html>
