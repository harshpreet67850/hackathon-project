<!DOCTYPE html>
<html>

<head>
  <title>Hackathon Dashboard</title>

  <style>

    body{
      background:#0f172a;
      color:white;
      font-family:Arial;
      text-align:center;
      padding-top:100px;
    }

    .card{
      background:#1e293b;
      width:300px;
      margin:auto;
      padding:30px;
      border-radius:20px;
    }

    button{
      background:#3b82f6;
      color:white;
      border:none;
      padding:12px 20px;
      border-radius:10px;
      cursor:pointer;
    }

    button:hover{
      background:#2563eb;
    }

  </style>

</head>

<body>

  <div class="card">

    <h1>AtomQuest Hackathon</h1>

    <p>My first deployed project 🚀</p>
    <input type="text" id="username" placeholder="Enter your name">
<br><br>

    <button onclick="showMessage()">
  Login
</button>
  </div>
<script>

function showMessage(){

  let name = document.getElementById("username").value;

  alert("Welcome " + name + " 🚀");

}

</script>
</body>

</html>
